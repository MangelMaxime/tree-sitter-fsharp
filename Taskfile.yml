# Cross-platform dev commands (https://taskfile.dev - `task --list`).
# Task embeds a POSIX-style shell + core utils (cp/rm/mkdir/…) in Go, so these
# run on Windows too.
version: '3'

vars:
  # Helix CONFIG runtime dir. Deliberately ignores
  # $HELIX_RUNTIME: on machines where it points at a Helix source checkout,
  # deploying there would clobber the checkout's tracked runtime/queries.
  HELIX_RUNTIME: '{{if eq OS "windows"}}{{env "APPDATA"}}/helix/runtime{{else}}{{env "HOME"}}/.config/helix/runtime{{end}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  generate:
    desc: Regenerate src/parser.c from grammar.js (skipped when unchanged)
    sources: [grammar.js]
    generates: [src/parser.c]
    cmds:
      - tree-sitter generate grammar.js
      - task: generate:signature

  generate:signature:
    desc: Regenerate signature/src/parser.c (the .fsi grammar derives from grammar.js)
    dir: signature
    sources: [grammar.js, ../grammar.js]
    generates: [src/parser.c]
    cmds:
      - tree-sitter generate

  build:
    desc: Compile parser.so and signature/parser.so
    deps: [generate]
    sources: [src/parser.c, src/scanner.c, signature/src/parser.c]
    generates: [parser.so, signature/parser.so]
    cmds:
      - tree-sitter build --output parser.so
      - tree-sitter build --output signature/parser.so signature

  dev:helix:
    desc: Build and deploy grammar + queries to Helix
    deps: [build]
    cmds:
      # Only touch the F# grammar - never the whole grammars dir (which holds
      # every other language's grammar too).
      - mkdir -p "{{.HELIX_RUNTIME}}/grammars"
      - cp parser.so "{{.HELIX_RUNTIME}}/grammars/fsharp.so"
      - cp signature/parser.so "{{.HELIX_RUNTIME}}/grammars/fsharp-signature.so"
      - |
        for lang in fsharp fsharp-signature; do
          case "$lang" in fsharp) src=queries;; *) src=queries/signature;; esac
          rm -rf "{{.HELIX_RUNTIME}}/queries/$lang"
          mkdir -p "{{.HELIX_RUNTIME}}/queries/$lang"
          for scm in "$src"/*.scm; do
            cp "$scm" "{{.HELIX_RUNTIME}}/queries/$lang/"
          done
          # Empty stubs for query types the repo doesn't define - they block
          # Helix from falling back to built-in queries that break this grammar.
          for q in highlights injections locals textobjects indents tags rainbows; do
            [ -f "{{.HELIX_RUNTIME}}/queries/$lang/$q.scm" ] || touch "{{.HELIX_RUNTIME}}/queries/$lang/$q.scm"
          done
        done
      - 'echo "Deployed to {{.HELIX_RUNTIME}} - restart Helix."'

  dev:zed:
    desc: Deploy grammar + queries into the Zed dev extension (zed/)
    deps: [generate]
    cmds:
      # Zed-specific queries (queries/zed/) take precedence; the Helix ones are
      # the fallback where the two dialects agree. indents never falls back
      # (Helix's @indent/@outdent/@extend mean different things in Zed).
      # locals is absent: Zed doesn't load locals.scm at all.
      - |
        for lang in fsharp fsharp-signature; do
          case "$lang" in fsharp) zed=queries/zed; helix=queries;; *) zed=queries/zed/signature; helix=queries/signature;; esac
          for q in highlights injections textobjects indents overrides brackets outline; do
            if [ -f "$zed/$q.scm" ]; then
              cp "$zed/$q.scm" "zed/languages/$lang/$q.scm"
            elif [ "$q" != indents ] && [ -f "$helix/$q.scm" ]; then
              cp "$helix/$q.scm" "zed/languages/$lang/$q.scm"
            fi
          done
        done
      # Zed only fetches grammars from a git repo at a pinned rev (it compiles
      # the WASM itself from src/), so auto-commit the current sources into a
      # throwaway mirror repo and point the generated manifest at the commit.
      - |
        if [ ! -d zed/.mirror/.git ]; then
          git init -q zed/.mirror
          # Let Zed fetch an arbitrary SHA over the file:// transport.
          git -C zed/.mirror config uploadpack.allowAnySHA1InWant true
        fi
        cp grammar.js zed/.mirror/grammar.js
        rm -rf zed/.mirror/src zed/.mirror/signature
        cp -r src zed/.mirror/src
        mkdir -p zed/.mirror/signature
        cp signature/grammar.js zed/.mirror/signature/grammar.js
        cp -r signature/src zed/.mirror/signature/src
        git -C zed/.mirror add -A
        if ! git -C zed/.mirror rev-parse -q --verify HEAD >/dev/null || \
           ! git -C zed/.mirror diff --cached --quiet; then
          git -C zed/.mirror -c user.name=dev-zed -c user.email=dev-zed@localhost commit -qm sync
          echo "Mirror updated."
        fi
        SHA="$(git -C zed/.mirror rev-parse HEAD)"
        cat > zed/extension.toml <<EOF
        # Generated by 'task dev:zed' - do not edit.

        id = "fsharp"
        name = "F# (local dev)"
        version = "0.0.1"
        schema_version = 1
        description = "Local development build of tree-sitter-fsharp-helix"
        repository = "https://github.com/MangelMaxime/tree-sitter-fsharp-helix"
        authors = ["Maxime Mangel <me@mangelmaxime.fr>"]
        languages = ["languages/fsharp", "languages/fsharp-signature"]

        [grammars.fsharp]
        repository = "file://{{.ROOT_DIR}}/zed/.mirror"
        rev = "$SHA"

        [grammars.fsharp_signature]
        repository = "file://{{.ROOT_DIR}}/zed/.mirror"
        rev = "$SHA"
        path = "signature"

        [language_servers.fsautocomplete]
        name = "FsAutoComplete"
        languages = ["FSharp", "F# Signature"]

        [debug_adapters.netcoredbg]
        EOF
        echo "extension.toml -> rev $SHA"
      # Drop the stale compiled grammar so Zed can't reuse it.
      - rm -f zed/grammars/fsharp.wasm zed/grammars/fsharp_signature.wasm
      # Zed compiles zed/src/lib.rs (the LSP glue) itself and needs this target.
      - |
        if command -v rustc >/dev/null 2>&1 && [ ! -d "$(rustc --print sysroot)/lib/rustlib/wasm32-wasip2" ]; then
          echo "WARNING: Rust target wasm32-wasip2 not installed - Zed can't build the"
          echo "         LSP glue (rustup target add wasm32-wasip2, or pacman -S rust-wasm)."
        fi
      - 'echo "In Zed: Extensions panel -> Rebuild (first time: ''zed: install dev extension'' -> {{.ROOT_DIR}}/zed)"'

  dev:nvim:
    desc: Build the parser and open a file in the repo-local Neovim config
    deps: [build]
    interactive: true
    cmds:
      # -u replaces the init file, so ~/.config/nvim is bypassed entirely.
      - nvim -u nvim/init.lua {{.CLI_ARGS | default "examples/references.fsx"}}

  test:
    desc: Run the corpus + highlight tests of both grammars
    cmds:
      - tree-sitter test {{.CLI_ARGS}}
      - task: test:signature

  test:signature:
    desc: Run the signature grammar's corpus tests
    dir: signature
    cmds:
      - tree-sitter test {{.CLI_ARGS}}

  test:all:
    desc: Every local gate - corpus, highlight, node extents, query validity, derived queries
    deps: [build]
    cmds:
      - tree-sitter test
      - task: test:signature
      - ./build.sh expansion
      - ./build.sh check-queries
      - ./build.sh derive-queries --check
      - ./build.sh highlight-snapshot --check

  test:expansion:
    desc: Helix expand-selection fixtures (test/expansion). Filter with -- -i NAME
    deps: [build]
    cmds:
      - ./build.sh expansion {{.CLI_ARGS}}

  check:queries:
    desc: Compile every .scm against the current grammar
    deps: [build]
    cmds:
      # Only highlights.scm and locals.scm are exercised by `tree-sitter test`;
      # the other 12 can reference a node that no longer exists and stay silent
      # until an editor loads them.
      - ./build.sh check-queries

  highlight:snapshot:
    desc: Write test/highlight-snapshot.txt (resolved capture per token of examples/references.fsx). -- --check to verify
    deps: [build]
    cmds:
      - ./build.sh highlight-snapshot {{.CLI_ARGS}}

  highlight:coverage:
    desc: List tokens with no highlight capture over a sample of the bench (needs the clones)
    deps: [build]
    cmds:
      - ./build.sh highlight-coverage {{.CLI_ARGS}}

  queries:derive:
    desc: Regenerate the Neovim, Zed and signature highlight queries from the Helix one
    cmds:
      - ./build.sh derive-queries {{.CLI_ARGS}}

  bench:
    desc: Real-world regression sweep (24 pinned repos, ~15 s once cloned). -- --signature sweeps the .fsi files
    deps: [build]
    cmds:
      - ./build.sh bench {{.CLI_ARGS}}

  score:
    desc: Four-axis scoreboard (coverage, rejection, degeneracy, highlight)
    deps: [build]
    cmds:
      - ./build.sh score {{.CLI_ARGS}}
