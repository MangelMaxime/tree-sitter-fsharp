name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The deploy plugin pushes the site to the gh-pages branch, which Pages serves
# (Settings -> Pages -> Deploy from a branch -> gh-pages).
permissions:
  contents: write

# Two deploys writing the branch at once would lose one of them.
concurrency:
  group: gh-pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache the Nacara runtime (Pagefind, tree-sitter toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.cache/nacara
          key: nacara-${{ hashFiles('docs/Docs.fsproj') }}

      - name: Build the site
        if: github.event_name == 'pull_request'
        run: ./build.sh docs

      - name: Build and publish the site
        if: github.event_name == 'push'
        run: ./build.sh docs --deploy
