name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# deploy-pages trades the run's OIDC token for a deployment, so the job needs
# these permissions and the github-pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the Nacara runtime (Pagefind, tree-sitter)
        uses: actions/cache@v4
        with:
          path: ~/.cache/nacara
          key: nacara-${{ hashFiles('docs/docs.fsproj') }}
      - name: Build the site
        run: ./build.sh docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: docs/output

  # Pages must be set to "GitHub Actions" as the source (Settings -> Pages).
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
