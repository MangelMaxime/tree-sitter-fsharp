name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Every local gate (`test-all`) on the three platforms Helix and Zed run on. MSVC is
  # stricter than gcc and clang about the scanner, so Windows is not optional.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: ./build.sh
            shell: bash
          - os: macos-latest
            build: ./build.sh
            shell: bash
          - os: windows-latest
            build: build.bat
            shell: cmd
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tree-sitter CLI (locked version)
        run: npm ci

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # grammar.js edited but src/ not regenerated: fail before testing stale artifacts.
      # Generation is deterministic, so one platform is enough.
      - name: Generated files are up to date
        if: runner.os == 'Linux'
        run: |
          ./build.sh generate --force
          git diff --exit-code -- src signature/src || {
            echo "::error::src/ or signature/src/ is stale - run './build.sh generate' and commit the result"
            exit 1
          }

      # Corpus, highlight assertions, examples, expansion fixtures, every query compiles,
      # derived queries in sync, highlight snapshot up to date.
      - name: Every gate
        run: ${{ matrix.build }} test-all

  # The scanner is 2,000 lines of hand-written C; a crash or hang there takes
  # the editor down with it. Always fuzzed: the run is a minute, and a grammar
  # change can push an unchanged scanner path into a case nobody hit before.
  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the fuzzer
        uses: tree-sitter/fuzz-action@v4
        with:
          # Real F# seeds, so libFuzzer starts inside the layout logic instead
          # of from empty input.
          corpus: examples
          # Same release as the CLI locked in package-lock.json; `latest` would
          # pair the generated parser with a library of a different ABI one day.
          tree-sitter-version: v0.26.8

  # The real-world regression gates: `bench` sweeps the 24 pinned repos in
  # scripts/bench-manifest.txt and fails on any file that parses worse than
  # test/bench/baseline.txt; `score --compare` gates the four axes of
  # test/score/baseline.json. The clones (~1.5 GB) are cached by manifest hash.
  bench:
    name: Real-world bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned repos
        uses: actions/cache@v4
        with:
          path: ~/.cache/fsharp-grammar-bench
          key: bench-${{ hashFiles('scripts/bench-manifest.txt') }}
      - name: Sweep and compare against the baseline
        run: ./build.sh bench --summary
      - name: Sweep the .fsi files with the signature grammar
        run: ./build.sh bench --signature --summary
      - name: Score and compare against the baseline
        run: ./build.sh score --compare
