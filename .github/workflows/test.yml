name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tree-sitter CLI (locked version)
        run: npm ci

      # grammar.js / scanner.c edited but src/ not regenerated → fail early,
      # before testing stale artifacts. Deterministic: the CLI version comes
      # from package-lock.json, the same one `npx tree-sitter` uses locally.
      - name: Check generated files are up to date
        # checksum-based (not `git diff`) so it also works under `act`, whose
        # container doesn't get a usable git context
        run: |
          before=$(cat src/parser.c src/grammar.json src/node-types.json | sha256sum)
          npx tree-sitter generate grammar.js
          after=$(cat src/parser.c src/grammar.json src/node-types.json | sha256sum)
          if [ "$before" != "$after" ]; then
            echo "::error::src/ is stale — run 'npx tree-sitter generate grammar.js' and commit the result"
            exit 1
          fi

      # Corpus (tree structure) + highlight assertions (query captures).
      - name: Corpus and highlight tests
        run: npx tree-sitter test

      # The living showcase must parse without a single error node.
      - name: layout.fsx parses clean
        run: |
          errors=$(npx tree-sitter parse examples/layout.fsx | grep -cE 'ERROR|MISSING' || true)
          if [ "$errors" -ne 0 ]; then
            echo "::error::examples/layout.fsx has $errors ERROR/MISSING nodes"
            npx tree-sitter parse examples/layout.fsx | grep -E 'ERROR|MISSING'
            exit 1
          fi

      # Node extents / Helix expand-selection behavior.
      - name: Expansion tests
        run: ./scripts/test-expansion.py
