name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tree-sitter CLI (locked version)
        run: npm ci

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # grammar.js / scanner.c edited but src/ not regenerated → fail early,
      # before testing stale artifacts. Deterministic: the CLI version comes
      # from package-lock.json, the same one `npx tree-sitter` uses locally.
      - name: Check generated files are up to date
        # checksum-based (not `git diff`) so it also works under `act`, whose
        # container doesn't get a usable git context
        run: |
          before=$(cat src/parser.c src/grammar.json src/node-types.json signature/src/parser.c signature/src/grammar.json signature/src/node-types.json | sha256sum)
          npx tree-sitter generate grammar.js
          (cd signature && npx tree-sitter generate)
          after=$(cat src/parser.c src/grammar.json src/node-types.json signature/src/parser.c signature/src/grammar.json signature/src/node-types.json | sha256sum)
          if [ "$before" != "$after" ]; then
            echo "::error::src/ or signature/src/ is stale - run 'task generate' and commit the result"
            exit 1
          fi

      # Corpus (tree structure) + highlight assertions (query captures).
      - name: Corpus and highlight tests
        run: npx tree-sitter test

      - name: Signature grammar corpus tests
        run: cd signature && npx tree-sitter test

      # The living showcase must parse without a single error node. An empty
      # glob is itself a failure: this step silently checked nothing for months
      # after examples/layout.fsx was deleted.
      - name: examples parse clean
        run: |
          shopt -s nullglob
          files=(examples/*.fsx)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no examples/*.fsx found - this check would pass vacuously"
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            if ! npx tree-sitter parse "$f" > /dev/null; then
              echo "::error::$f has ERROR/MISSING nodes"
              npx tree-sitter parse "$f" | grep -E 'ERROR|MISSING' || true
              status=1
            fi
          done
          exit $status

      # The .NET gates below load these libraries in-process.
      - name: Build the parsers
        run: |
          npx tree-sitter build --output parser.so
          npx tree-sitter build --output signature/parser.so signature

      # Node extents / Helix expand-selection behavior.
      - name: Expansion tests
        run: dotnet run --project build -- expansion

      # `tree-sitter test` exercises highlights.scm and locals.scm only; the
      # other Helix, Zed and Neovim queries can name a node that no longer
      # exists and stay silent until an editor loads them.
      - name: Every query compiles
        run: dotnet run --project build -- check-queries

      # queries/nvim/highlights.scm is generated from the Helix file, and
      # queries/zed/highlights.scm must contain the same patterns under Zed's
      # capture names; a rule added to one and forgotten in the other fails here.
      - name: Derived highlight queries are in sync
        run: dotnet run --project build -- derive-queries --check

      # test/highlight/snapshot.txt is the resolved capture of every token of the
      # gallery file; a query change that moves a colour shows up as a diff there.
      - name: Highlight snapshot is up to date
        run: dotnet run --project build -- highlight-snapshot --check

  # The scanner is 2,000 lines of hand-written C; a crash or hang there takes
  # the editor down with it. Always fuzzed: the run is a minute, and a grammar
  # change can push an unchanged scanner path into a case nobody hit before.
  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the fuzzer
        uses: tree-sitter/fuzz-action@v4
        with:
          # Real F# seeds, so libFuzzer starts inside the layout logic instead
          # of from empty input.
          corpus: examples
          # Same release as the CLI locked in package-lock.json; `latest` would
          # pair the generated parser with a library of a different ABI one day.
          tree-sitter-version: v0.26.8

  # The real-world regression gates: `bench` sweeps the 24 pinned repos in
  # scripts/bench-manifest.txt and fails on any file that parses worse than
  # test/bench/baseline.txt; `score --compare` gates the four axes of
  # test/score/baseline.json. The clones (~1.5 GB) are cached by manifest hash.
  bench:
    name: Real-world bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache the pinned repos
        uses: actions/cache@v4
        with:
          path: ~/.cache/fsharp-grammar-bench
          key: bench-${{ hashFiles('scripts/bench-manifest.txt') }}
      # git checkout does not preserve mtimes, and the tools refuse to run when
      # grammar.js looks newer than src/parser.c (a stale-parser guard).
      - run: touch src/parser.c signature/src/parser.c
      - name: Build the parsers
        run: |
          npx tree-sitter build --output parser.so
          npx tree-sitter build --output signature/parser.so signature
      - name: Sweep and compare against the baseline
        run: dotnet run --project build -- bench --summary
      - name: Sweep the .fsi files with the signature grammar
        run: dotnet run --project build -- bench --signature --summary
      - name: Score and compare against the baseline
        run: dotnet run --project build -- score --compare

  # Helix and Zed run on Windows too, and MSVC is stricter than gcc about the
  # scanner. Corpus + highlight tests only; the Python gates run on Linux.
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Corpus and highlight tests
        run: |
          npx tree-sitter test
          cd signature && npx tree-sitter test
