name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tree-sitter CLI (locked version)
        run: npm ci

      # grammar.js / scanner.c edited but src/ not regenerated → fail early,
      # before testing stale artifacts. Deterministic: the CLI version comes
      # from package-lock.json, the same one `npx tree-sitter` uses locally.
      - name: Check generated files are up to date
        # checksum-based (not `git diff`) so it also works under `act`, whose
        # container doesn't get a usable git context
        run: |
          before=$(cat src/parser.c src/grammar.json src/node-types.json | sha256sum)
          npx tree-sitter generate grammar.js
          after=$(cat src/parser.c src/grammar.json src/node-types.json | sha256sum)
          if [ "$before" != "$after" ]; then
            echo "::error::src/ is stale — run 'npx tree-sitter generate grammar.js' and commit the result"
            exit 1
          fi

      # Corpus (tree structure) + highlight assertions (query captures).
      - name: Corpus and highlight tests
        run: npx tree-sitter test

      # The living showcase must parse without a single error node. An empty
      # glob is itself a failure: this step silently checked nothing for months
      # after examples/layout.fsx was deleted.
      - name: examples parse clean
        run: |
          shopt -s nullglob
          files=(examples/*.fsx)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no examples/*.fsx found - this check would pass vacuously"
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            if ! npx tree-sitter parse "$f" > /dev/null; then
              echo "::error::$f has ERROR/MISSING nodes"
              npx tree-sitter parse "$f" | grep -E 'ERROR|MISSING' || true
              status=1
            fi
          done
          exit $status

      # Node extents / Helix expand-selection behavior.
      - name: Expansion tests
        run: ./scripts/test-expansion.py

  # The scanner is 2,000 lines of hand-written C; a crash or hang there takes
  # the editor down with it. Fuzz it whenever it changes (same setup as
  # ionide/tree-sitter-fsharp).
  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for scanner changes
        id: scanner-check
        run: |
          if git diff --quiet HEAD^ -- src/scanner.c; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Run the fuzzer
        uses: tree-sitter/fuzz-action@v4
        if: steps.scanner-check.outputs.changed == 'true'

  # The real-world regression gate: scripts/bench.py sweeps the 24 pinned repos
  # in scripts/bench-manifest.txt and fails on any file that parses worse than
  # test/bench/baseline.txt. Until now it only ran when someone remembered to.
  # The clones (~1.5 GB) are cached by manifest hash, so a run is a few minutes.
  bench:
    name: Real-world bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the pinned repos
        uses: actions/cache@v4
        with:
          path: ~/.cache/fsharp-grammar-bench
          key: bench-${{ hashFiles('scripts/bench-manifest.txt') }}
      # git checkout does not preserve mtimes, and bench.py refuses to run when
      # grammar.js looks newer than src/parser.c (a stale-parser guard).
      - run: touch src/parser.c
      - name: Sweep and compare against the baseline
        run: ./scripts/bench.py --summary

  # Helix and Zed run on Windows too, and MSVC is stricter than gcc about the
  # scanner. Corpus + highlight tests only; the Python gates run on Linux.
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Corpus and highlight tests
        run: npx tree-sitter test
