[package]
name = "tree-sitter-fsharp-mangel"
description = "F# grammar for tree-sitter"
version = "0.2.1"
authors = ["Mangel Maxime <me@mangelmaxime.fr>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "fsharp"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/MangelMaxime/tree-sitter-fsharp"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "signature/grammar.js",
  "signature/src/*",
  "tree-sitter.json",
  "/LICENSE.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
